<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Meri Shikayat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .offline-container {
            background: white;
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #1a237e;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #1a237e;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .offline-tips {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            text-align: left;
        }

        .offline-tips h3 {
            color: #1a237e;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }

        .offline-tips ul {
            list-style: none;
            padding: 0;
        }

        .offline-tips li {
            color: #666;
            font-size: 0.9375rem;
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .offline-tips li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }

        @media (max-width: 767px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, you can still view cached content!</p>

        <div class="offline-actions">
            <button class="btn-primary" onclick="location.reload()">
                Try Again
            </button>
            <button class="btn-secondary" onclick="window.history.back()">
                Go Back
            </button>
        </div>

        <div class="offline-tips">
            <h3>While you're offline, you can:</h3>
            <ul>
                <li>View previously loaded pages</li>
                <li>Browse cached complaints</li>
                <li>Draft new complaints (will sync when online)</li>
            </ul>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            location.reload();
        });

        // Show online status
        if (navigator.onLine) {
            document.querySelector('p').textContent = 'Connection restored! Click "Try Again" to continue.';
            document.querySelector('.btn-primary').textContent = 'Continue';
        }
    </script>
</body>

</html>
