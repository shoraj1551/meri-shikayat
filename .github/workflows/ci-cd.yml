# GitHub Actions CI/CD Pipeline
# TASK-PR-013: Automate testing and deployment

name: CI/CD Pipeline

on:
    push:
        branches: [main, dev, uat]
    pull_request:
        branches: [main, dev]

jobs:
    installation:
        name: Clean install, bootstrap tests and web build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm install --global npm@11.11.0
            - run: npm ci
            - run: npm run test:tooling
            - run: npm run test:bootstrap
            - run: npm run test:api
            - run: npm test --workspace client
            - run: npm run build-client
            - run: git diff --exit-code -- package-lock.json

    container-build:
        name: Verify API images
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: installation
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
            - run: docker build -f server/Dockerfile -t meri-shikayat-api:verify .
            - run: docker build -f server/Dockerfile.dev -t meri-shikayat-api:dev-verify .
            - name: Production startup, readiness outages and SIGTERM
              run: node scripts/test-api-container.mjs

    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - run: npm install --global npm@11.11.0

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint --workspace server

    test:
        name: Isolated API integration and worker isolation
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            mongodb:
                image: mongo:8.0
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - run: npm install --global npm@11.11.0

            - name: Install dependencies
              run: npm ci

            - name: Unit coverage (without database access)
              run: npm run test:coverage --workspace server

            - name: Real API and parallel worker isolation
              run: npm run test:api:integration
              env:
                  TEST_MONGODB_BASE_URI: mongodb://127.0.0.1:27017/
                  TEST_REDIS_BASE_URI: redis://127.0.0.1:6379/0

            - name: Upload coverage
              uses: codecov/codecov-action@v3
              if: always()
              with:
                  files: ./server/coverage/unit/lcov.info
                  fail_ci_if_error: false

    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm
                  cache-dependency-path: package-lock.json

            - run: npm install --global npm@11.11.0
            - run: npm ci

            - name: Block high-severity dependency vulnerabilities
              run: npm audit --omit=dev --audit-level=high

            - name: Run Snyk Security Scan
              uses: snyk/actions/node@master
              if: ${{ env.SNYK_TOKEN != '' }}
              with:
                  args: --severity-threshold=high --production

    # Vercel pilot deployments are managed by the connected Vercel project.
    # Keep image verification above, but do not publish to Docker Hub or claim
    # deployment success from placeholder echo-only jobs.
