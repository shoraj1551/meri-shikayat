services:
  - type: web
    name: meri-shikayat-api
    env: docker
    region: singapore
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ML_SERVICE_ENABLED
        value: "true"
      - key: ML_SERVICE_URL
        sync: false
  - type: web
    name: meri-shikayat-ml
    env: docker
    region: singapore
    plan: free
    dockerContext: ./ml-services
    dockerfilePath: ./ml-services/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
