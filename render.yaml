services:
  - type: web
    name: meri-shikayat-api
    env: docker
    region: singapore
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: CORS_ORIGIN
        value: https://meri-shikayat-prod.vercel.app,https://meri-shikayat-dev.vercel.app,https://meri-shikayat-uat.vercel.app
      - key: ML_SERVICE_ENABLED
        value: "true"
      - key: ML_SERVICE_URL
        sync: false
  - type: web
    name: meri-shikayat-ml
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./ml-services/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
